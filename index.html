<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcheLixo</title>
    <meta name="description" content="Page description">
    <meta name="keywords" content="keyword1, keyword2">
    <meta property="og:title" content="Page Title">
    <meta property="og:description" content="Page description">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.example.com">
    <meta property="og:image" content="https://www.example.com/image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Page Title">
    <meta name="twitter:description" content="Page description">
    <meta name="twitter:image" content="https://www.example.com/image.jpg">

    <link rel="stylesheet" href="node_modules/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="node_modules/leaflet/dist/leaflet.js"></script>

    <section id="map-section">
        <div class="map-controls" aria-label="Filtros de pontos no mapa">
            <div class="filter-group area-filters" role="group" aria-label="Filtrar por região">
                <span class="filter-label">Região</span>
                <button class="filter-btn active" type="button" data-filter-group="area" data-filter="todos">Todas</button>
                <button class="filter-btn" type="button" data-filter-group="area" data-filter="artur-alvim">Artur Alvim</button>
                <button class="filter-btn" type="button" data-filter-group="area" data-filter="proximos">Próximos</button>
            </div>
            <div class="filter-group category-filters" role="group" aria-label="Filtrar por tipo de ponto">
                <span class="filter-label">Tipo de ponto</span>
                <button class="filter-btn active" type="button" data-filter-group="categoria" data-filter="todos">Todos</button>
                <button class="filter-btn" type="button" data-filter-group="categoria" data-filter="ecoponto">Ecopontos</button>
                <button class="filter-btn" type="button" data-filter-group="categoria" data-filter="pev">PEVs</button>
                <button class="filter-btn" type="button" data-filter-group="categoria" data-filter="especifico">Coleta específica</button>
            </div>
        </div>
        <aside class="map-legend" aria-label="Legenda das cores dos marcadores">
            <span class="legend-title">Legenda</span>
            <span class="legend-item"><span class="legend-swatch legend-ecoponto"></span>Ecopontos</span>
            <span class="legend-item"><span class="legend-swatch legend-pev"></span>PEVs</span>
            <span class="legend-item"><span class="legend-swatch legend-especifico"></span>Coleta específica</span>
        </aside>
        <div id="map"></div>
    </section>

    <script type="module" src="js/script.js"></script>
</body>

</html>
